name: Upload Great Britain GTFS splits
on:
  workflow_call:
jobs:
  upload-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gb-gtfs-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download Great Britain GTFS
        run: curl --fail --location --retry 3 --output gb.zip https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/all/
      - name: Check source and splitter fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum gb.zip level-2.geojson area_names.tsv greater_manchester.geojson src/main.rs Cargo.toml Cargo.lock > gb.sha256
          if gh release download latest --pattern gb.sha256 --output previous.sha256 && cmp -s gb.sha256 previous.sha256; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.fingerprint.outputs.skip != 'true'
      - name: Extract and split
        if: steps.fingerprint.outputs.skip != 'true'
        run: |
          unzip -q gb.zip -d gtfs_raw
          rm gb.zip
          cargo test --locked
          cargo run --locked --release
      - name: Zip county feeds
        if: steps.fingerprint.outputs.skip != 'true'
        run: |
          mkdir zips
          for dir in gtfs_output/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -q -r "../../zips/$name.zip" .)
            rm -r "$dir"
          done
      - name: Publish release
        if: steps.fingerprint.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest Great Britain GTFS splits" --notes "Automatically updated county GTFS feeds." --prerelease
          gh release upload latest zips/*.zip --clobber
          # Remove stale split ZIPs only after all replacement ZIPs upload.
          gh release view latest --json assets --jq '.assets[].name' > published-assets.txt
          while IFS= read -r asset; do
            case "$asset" in
              *.zip)
                if [ ! -f "zips/$asset" ]; then
                  gh release delete-asset latest "$asset" --yes
                fi
                ;;
            esac
          done < published-assets.txt
          if grep -Fxq england.sha256 published-assets.txt; then
            gh release delete-asset latest england.sha256 --yes
          fi
          gh release upload latest gb.sha256 --clobber
