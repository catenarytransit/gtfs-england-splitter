name: Upload England GTFS splits
on:
  workflow_call:
jobs:
  upload-release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: england-gtfs-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download England GTFS
        run: curl --fail --location --retry 3 --output england.zip https://data.bus-data.dft.gov.uk/timetable/download/gtfs-file/england/
      - name: Check source and splitter fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum england.zip level-2.geojson src/main.rs Cargo.toml Cargo.lock > england.sha256
          if gh release download latest --pattern england.sha256 --output previous.sha256 && cmp -s england.sha256 previous.sha256; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.fingerprint.outputs.skip != 'true'
      - name: Extract and split
        if: steps.fingerprint.outputs.skip != 'true'
        run: |
          unzip -q england.zip -d gtfs_raw
          rm england.zip
          cargo test --locked
          cargo run --locked --release
      - name: Zip county feeds
        if: steps.fingerprint.outputs.skip != 'true'
        run: |
          mkdir zips
          for dir in gtfs_output/*/; do
            name=$(basename "$dir")
            (cd "$dir" && zip -q -r "../../zips/$name.zip" .)
            rm -r "$dir"
          done
      - name: Publish release
        if: steps.fingerprint.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest England GTFS splits" --notes "Automatically updated county GTFS feeds." --prerelease
          gh release upload latest zips/*.zip --clobber
          gh release upload latest england.sha256 --clobber
